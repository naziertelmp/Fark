<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background dark red/black gradient feel -->
  <rect x="10" y="10" width="180" height="180" rx="30" fill="#1a0a0a" />
  <rect x="10" y="10" width="180" height="180" rx="30" fill="url(#grad)" />
  
  <!-- Define gradient -->
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b0a0a" />
      <stop offset="100%" stop-color="#0d0d0d" />
    </radialGradient>
  </defs>

  <!-- Window frame with sharp edges -->
  <rect x="35" y="35" width="130" height="100" rx="8" fill="#2b0000" stroke="#ff0000" stroke-width="4" />
  
  <!-- Cracks in window -->
  <path d="M50 35 L80 65 L70 90 L90 110" stroke="#ff4444" stroke-width="2" fill="none" />
  <path d="M80 65 L110 70 L100 95" stroke="#ff4444" stroke-width="2" fill="none" />
  <path d="M150 35 L130 60 L140 80 L120 110" stroke="#ff4444" stroke-width="2" fill="none" />

  <!-- Glowing red eye inside window -->
  <ellipse cx="100" cy="85" rx="20" ry="15" fill="#000000" stroke="#ff0000" stroke-width="3" />
  <circle cx="100" cy="85" r="8" fill="#ff0000" />
  <circle cx="100" cy="85" r="4" fill="#ffffff" opacity="0.8" />
  
  <!-- Teeth / spikes at bottom of window -->
  <polygon points="60,135 70,120 80,135 90,120 100,135 110,120 120,135 130,120 140,135" fill="#ff0000" opacity="0.8" />
  
  <!-- Tunnel lines below -->
  <rect x="50" y="150" width="100" height="10" rx="5" fill="#660000" />
  <rect x="70" y="158" width="60" height="6" rx="3" fill="#990000" />
  
  <!-- Text label -->
  <text x="100" y="190" font-family="Creepster, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ff3333" text-anchor="middle">PlixWin</text>
</svg>
